services:
  monitor:
    # Pre-built image from GHCR — replace with a specific tag for production use
    # e.g. ghcr.io/jasmeralia/mv_video_monitor:1.0.0
    image: ghcr.io/jasmeralia/mv_video_monitor:master

    # Uncomment to build locally instead of pulling from GHCR:
    # build: .

    # Mount your config file and persistent data directory
    volumes:
      - /mnt/myzmirror/mv_video_monitor/config:/config:ro   # config.yaml is read from here
      - /mnt/myzmirror/mv_video_monitor/data:/data           # database and logs are written here

    environment:
      # Path to the config file inside the container (default shown; override if needed)
      CONFIG_PATH: /config/config.yaml

      # Set to "1" or "true" to scrape without writing to the DB or sending notifications
      # DRY_RUN: "1"

    # Keep the container running under normal Docker lifecycle controls
    restart: unless-stopped
