creators:
  - creator_id: "1002990973"
    creator_name: "karneli_bandi"   # used in profile URL path
    display_name: "Karneli Bandi"   # used in notifications
  # - creator_id: "XXXXXXXXXX"
  #   creator_name: "creator_slug"
  #   display_name: "Display Name"

scraping:
  delay_between_creators_min: 30   # seconds
  delay_between_creators_max: 60
  delay_between_pages_min: 3       # seconds between pagination requests
  delay_between_pages_max: 8
  page_timeout: 30000              # ms - Playwright page.goto timeout
  max_retries: 3
  retry_backoff_base: 10           # seconds, exponential: 10, 20, 40
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
  headless: true

notifications:
  # Single type: "email", "discord", or "matrix"
  # Multiple types: ["email", "discord"]
  type: "email"

  email:
    smtp_host: "smtp.example.com"
    smtp_port: 587
    smtp_use_tls: true
    smtp_user: "user@example.com"
    smtp_password: "password"
    from_address: "manyvids-monitor@example.com"
    from_name: "ManyVids Monitor"
    to_addresses:
      - "recipient@example.com"

  # Future webhook configs
  discord:
    webhook_url: "https://discord.com/api/webhooks/..."

  matrix:
    homeserver: "https://matrix.example.com"
    room_id: "!roomid:example.com"
    access_token: "..."

database:
  path: "/data/monitor.db"

logging:
  level: "INFO"
  file: "/data/logs/monitor.log"
  max_bytes: 10485760    # 10MB
  backup_count: 5
